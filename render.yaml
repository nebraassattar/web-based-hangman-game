services:
  - type: web
    name: web-based-hangman-game
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - --error-logfile - server:app
    healthCheckPath: /
